name: Build and Push

# Triggers on push to main, or on a release tag, per OAN convention:
# v{SemVer}, optionally with an -rcN pre-release suffix.
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  # The same checks as ci.yml, gating the image build directly rather than
  # trusting that the other workflow happened to pass.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Dead code
        run: bun run knip

      - name: Test
        run: bun run test

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy cache date
        id: trivy-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy binary and vulnerability DB
        uses: actions/cache@v4
        with:
          path: |
            bin/trivy
            ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ runner.arch }}-${{ steps.trivy-date.outputs.date }}
          restore-keys: |
            trivy-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Trivy (if not cached)
        run: |
          if [ ! -x bin/trivy ]; then
            mkdir -p bin
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b bin
          fi

      - uses: docker/setup-buildx-action@v3

      # Skipped on a PR: that leg only builds, for early Dockerfile feedback,
      # and never publishes. Falls back to GITHUB_TOKEN if GHCR_PAT is unset.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Set image owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set image tag
        run: echo "TAG=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_ENV"

      # Loaded locally first so Trivy scans the exact image that gets pushed.
      - name: Build (local, unpushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: experience-ui:${{ env.TAG }}

      # Report-only. It does not fail the build: a base-image CVE with no fix
      # available should not block a deploy, and the dependency gate in
      # security.yml is where an actionable finding stops things.
      - name: Trivy image scan (report)
        run: |
          ./bin/trivy image \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --no-progress \
            "experience-ui:${{ env.TAG }}"

      - name: Tag and push
        if: github.event_name != 'pull_request'
        run: |
          BASE="ghcr.io/${OWNER}/experience-ui"
          docker tag "experience-ui:${TAG}" "${BASE}:${TAG}"
          docker tag "experience-ui:${TAG}" "${BASE}:${GITHUB_SHA}"
          docker tag "experience-ui:${TAG}" "${BASE}:latest"
          docker push "${BASE}:${TAG}"
          docker push "${BASE}:${GITHUB_SHA}"
          docker push "${BASE}:latest"
