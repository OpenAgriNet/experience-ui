name: Security

# Scans bun.lock for known CVEs, before anything is built into an image.
# build-and-push.yml has its own Trivy step that scans the built image.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy cache date
        id: trivy-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy binary and vulnerability DB
        uses: actions/cache@v4
        with:
          path: |
            bin/trivy
            ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ runner.arch }}-${{ steps.trivy-date.outputs.date }}
          restore-keys: |
            trivy-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Trivy (if not cached)
        run: |
          if [ ! -x bin/trivy ]; then
            mkdir -p bin
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b bin
          fi

      # --ignore-unfixed is what keeps this gate liveable: it only fires when an
      # upgrade is actually available, so a red run is always actionable.
      - name: Trivy dependency scan
        run: |
          ./bin/trivy fs \
            --scanners vuln \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --no-progress \
            .
