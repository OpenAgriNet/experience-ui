# Cache policy by path. Declared as a map so that every header can be set once
# at server level: nginx drops all inherited add_header directives from a block
# the moment that block declares one of its own, and per-location cache headers
# are the usual way people lose their security headers without noticing.
map $uri $cache_control {
    default                   "public, max-age=3600";
    ~^/assets/                "public, max-age=31536000, immutable";
    ~^/brand/                 "public, max-age=3600";
    /index.html               "no-store";
    /config.json              "no-store";
}

server {
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # /config.json is the deployment's own configuration and the file it
    # overrides to rebrand or switch features. A cached copy silently ignores
    # the change, so it is never cached. index.html names the content-hashed
    # bundles, so caching it pins the old ones.
    add_header Cache-Control $cache_control always;

    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "no-referrer" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # The deployment's configuration is served from its own directory, not from
    # the static root, so that a deployment overrides it by mounting a
    # directory rather than a single file. Single-file bind mounts fail
    # outright on some runtimes, and a Kubernetes ConfigMap mounted with
    # subPath never sees later updates; a directory mount works everywhere and
    # picks up changes.
    #
    # The image ships a default here, so an unconfigured container still runs.
    location = /config.json {
        root        /etc/experience-ui;
        default_type application/json;
    }

    # For whatever runs in front of this container.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # A missing file with a file extension is missing, not a route. Without
    # this it would fall through to index.html and a broken image would arrive
    # as HTML with a 200, which is a confusing thing to debug.
    location ~* \.(js|mjs|css|map|json|svg|png|jpe?g|gif|ico|webp|avif|woff2?|ttf|eot|mp3|wav|txt|xml)$ {
        try_files $uri =404;
    }

    # Everything else is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
